apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: barbertime-dev
data:
  PORT: "8080"
  GIN_MODE: "release"
  DB_HOST: "postgresql.barbertime-dev-infrastructure.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "barbertime"
  DB_SSLMODE: "disable"
  JWT_EXPIRATION_HOURS: "24"
  UPLOAD_DIR: "./uploads"
  MAX_UPLOAD_SIZE: "5242880"
  CORS_ALLOWED_ORIGINS: "*"
  ELASTICSEARCH_URL: "http://elasticsearch.barbertime-dev-infrastructure.svc.cluster.local:9200"
  ELASTICSEARCH_INDEX_PREFIX: "barbertime"
  REDIS_HOST: "redis.barbertime-dev-infrastructure.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.barbertime-dev-infrastructure.svc.cluster.local:5672/"
