apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barbertime-api-ingress
  namespace: barbertime-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # /barbertime-dev/ veya /barbertime-dev/xxx → API'ye yönlendirir
      - path: /barbertime-dev(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: barbertime-api
            port:
              number: 80
