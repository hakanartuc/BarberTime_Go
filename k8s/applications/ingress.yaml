apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barbertime-api-ingress
  namespace: barbertime-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: api.barbertime.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: barbertime-api
            port:
              number: 80
