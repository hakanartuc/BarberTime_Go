apiVersion: apps/v1
kind: Deployment
metadata:
  name: barbertime-consumer
  namespace: barbertime-dev
  labels:
    app: barbertime-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: barbertime-consumer
  template:
    metadata:
      labels:
        app: barbertime-consumer
    spec:
      containers:
      - name: consumer
        image: hakanartuc/barbertime:queue-consumer-dev-go-latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: consumer-config
        - secretRef:
            name: consumer-secret
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep '[c]onsumer' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: barbertime-consumer-hpa
  namespace: barbertime-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: barbertime-consumer
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 1
        periodSeconds: 30
      selectPolicy: Max
